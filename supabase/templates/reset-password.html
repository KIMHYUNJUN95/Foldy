<!-- Supabase Dashboard → Authentication → Emails → Templates → "Reset password".
     Subject: Reset your Foldy password
     English only (decision 2026-10-23) — the email is sent before we know the person's language.
     This file is the source of truth; paste it into the dashboard when it changes. -->
<div style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; max-width: 480px; margin: 0 auto; padding: 32px 24px; color: #16141f;">
  <h2 style="margin: 0 0 12px; font-size: 20px; font-weight: 700;">Reset your Foldy password</h2>
  <p style="margin: 0 0 24px; font-size: 15px; line-height: 1.6; color: #4b4857;">
    Tap the button below to set a new password.
  </p>
  <p style="margin: 0 0 24px;">
    <a href="{{ .ConfirmationURL }}" style="display: inline-block; padding: 12px 24px; border-radius: 12px; background: #7a52e6; color: #ffffff; font-size: 15px; font-weight: 600; text-decoration: none;">Set new password</a>
  </p>
  <p style="margin: 0; font-size: 13px; line-height: 1.6; color: #8a8796;">
    If you didn't ask to reset your password, you can ignore this email. Your password stays the same.
  </p>
</div>
