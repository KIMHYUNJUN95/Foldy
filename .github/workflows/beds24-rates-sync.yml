name: Beds24 rates sync

# WHY THIS EXISTS
# ---------------
# 판매 캘린더의 가격·최소숙박·재고는 `room_daily_rates` 에서 온다. 그 표가 낡으면 화면은
# **없는 가격을 보여주는 화면**이 된다 — 그대로 가격을 고치면 엉뚱한 값에서 출발한다.
#
# 2026-09-29 재고 웹훅을 이쪽으로 전환한 뒤로 **웹훅이 메인**이다 — Beds24 에서 가격·재고·최소숙박이
# 바뀌면 그 건물을 몇 초 안에 다시 읽는다(`src/lib/beds24/price-webhook.ts`). 이 워크플로는 놓친 배달을
# 메우는 안전망이다. 저쪽 프로젝트도 `priceWebhook`(즉시) + `scheduledBeds24PriceSync`(주기)를 함께 돌린다.
#
# 한 번에 **가장 오래 안 읽힌 건물부터 3곳만** 읽는다(2026-10-21). 9건물을 한 번에 읽던 때는 Beds24
# 연결이 한 번 늦으면 60초 상한을 넘겨 504 로 실패했다(10-19 · 10-21).
#
# 안전망이 읽었는데 Beds24 가격이 우리 표와 다르면 = **웹훅이 그 변경을 놓쳤다.** 응답의
# `webhookMissed` 가 비어 있지 않으면 이 작업을 실패로 끝내 GitHub 메일로 알린다 — 판매 캘린더가
# 실시간이 아니게 됐다는 뜻이다(Beds24 웹훅 설정 · 배달 상태를 확인할 것).
#
# CADENCE
# -------
# GitHub Actions 의 schedule 은 **정시에 안 온다.** 이 저장소에서 `*/5` 로 걸어 둔 작업이 실제로
# 40분~3시간 40분 뒤에 돈 적이 있다(recruit-sync 실측). 그래서 15분으로 적어 두되 실제로는
# 그보다 늦게 도는 것을 전제한다 — 동기화가 멱등하므로 늦거나 겹쳐도 해가 없다.
#
# SETUP (one-time): repository secret `BEDS24_WEBHOOK_SECRET`
#   (GitHub → repo Settings → Secrets and variables → Actions)
#   값은 Vercel 프로덕션의 BEDS24_WEBHOOK_SECRET 과 같아야 한다.

on:
  schedule:
    # :07 / :22 / :37 / :52 — 정각을 피해 다른 작업과 겹치지 않게 둔다.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch: {}

concurrency:
  group: beds24-rates-sync
  # 앞 실행이 아직 돌고 있으면 새로 시작하지 않는다. 겹쳐도 멱등하지만 Beds24 크레딧을
  # 두 배로 쓸 이유가 없다.
  cancel-in-progress: false

jobs:
  rates-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger Beds24 rates sync
        env:
          RATES_URL: https://stay-ops-two.vercel.app/api/beds24/rates-sync
          WEBHOOK_SECRET: ${{ secrets.BEDS24_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${WEBHOOK_SECRET}" ]; then
            echo "::error::BEDS24_WEBHOOK_SECRET repository secret is not set — add it in repo Settings → Secrets → Actions."
            exit 1
          fi
          code=$(curl -sS -o /tmp/rates-sync.json -w '%{http_code}' \
            -X POST "${RATES_URL}" \
            -H "x-beds24-webhook-secret: ${WEBHOOK_SECRET}" \
            --max-time 120)
          echo "HTTP ${code}"
          cat /tmp/rates-sync.json || true
          echo
          # 202 = 동기화 일시정지 상태(BEDS24_SYNC_PAUSED). 실패가 아니다.
          if [ "${code}" != "200" ] && [ "${code}" != "202" ]; then
            echo "::error::rates sync failed with HTTP ${code}"
            exit 1
          fi
          if [ "${code}" = "200" ]; then
            missed=$(jq -r '[.webhookMissed[]? | "\(.externalPropertyId):\(.changes)"] | join(", ")' /tmp/rates-sync.json)
            if [ -n "${missed}" ]; then
              echo "::error::Beds24 webhook missed price changes (property:cells) — ${missed}. Check the Beds24 inventory webhook."
              exit 1
            fi
          fi
