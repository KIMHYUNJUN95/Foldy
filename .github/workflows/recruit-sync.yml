name: Recruit application sync

# WHY THIS EXISTS (2026-09-09)
# ----------------------------
# 채용 사이트(haru-recruit / Firebase)에는 Cloud Function 이 **없다**. 저장소를 확인한 결과
# functions/ 디렉터리도 firebase.json 의 functions 설정도 없고, 지원서는 브라우저가 Firestore 에
# 직접 쓴다(ApplicationPage.tsx → addDoc). 즉 「지원서가 생기면 Foldy 로 밀어넣는」 주체가 아예
# 존재하지 않는다.
#
# 함수를 새로 만들려면 Firebase Blaze(카드 등록)가 필요해 「무료」 조건과 충돌한다. 그래서 Foldy
# 가 Firestore 를 당겨온다. 이 워크플로가 그 방아쇠다.
#
# WHY GITHUB ACTIONS AND NOT VERCEL CRON
# --------------------------------------
# 1. Vercel Hobby 는 크론 2개·하루 1회가 상한이고, vercel.json 이 이미 두 칸을 다 쓰고 있다
#    (reconcile + task reminders). 5분 주기는 애초에 표현할 수 없다.
# 2. 2026-07-22 에 Vercel 크론이 며칠간 발화하지 않아 예약 5일치가 조용히 비었다. 이후 새 스케줄
#    작업은 처음부터 외부 트리거를 쓴다(beds24-reconcile.yml, beds24-reviews-sync.yml 과 동일).
#
# NO SECRET NEEDED
# ----------------
# 엔드포인트는 외부 입력을 받지 않는다 — 하는 일이 「공개 Firestore 를 읽어 우리 DB 에 넣는다」로
# 고정이라 호출자가 데이터를 위조할 수 없다. 남는 위험인 남용은 서버가 60초 창으로 막는다
# (recruit_sync_state). 그래서 저장소 시크릿 설정이 필요 없다 — 이 워크플로는 머지되는 즉시 돈다.
#
# 수신은 재전송해도 안전하다((organization_id, source, external_id) 유니크 + 지원자 정보만 갱신).
# 나중에 Cloud Function 을 붙여도 이 워크플로와 겹쳐서 중복이 생기지 않는다.

on:
  schedule:
    # 최신분: 5분 주기로 "요청"한다. **실제로는 그렇게 자주 돌지 않는다.**
    #
    # 2026-09-11 실측: 실행 간격이 40분 ~ 3시간 40분이었다. GitHub 은 예약 실행을 부하에 따라
    # 지연·생략하고, 짧은 주기일수록 심하게 솎아낸다(무료 러너에 보장이 없다). 그래서 이 크론은
    # 「몇 분 안에 반영」이 아니라 **「하루 안에는 확실히 들어온다」는 안전망**으로 본다.
    #
    # 실무에서 체감되는 신선도는 콘솔 쪽이 만든다 — 화면을 여는 순간 같은 엔드포인트를 한 번
    # 부르므로(recruit-live-refresh.tsx) **보러 갈 때는 언제나 최신**이다.
    #
    # 정말 분 단위가 필요해지면 외부 크론 서비스로 이 URL 을 호출하면 된다(시크릿이 없어 URL 만
    # 등록하면 되고, 서버가 60초 창으로 과호출을 막는다).
    - cron: "*/5 * * * *"
    # 전량 훑기: 하루 1회 04:20 Asia/Tokyo (= 19:20 UTC 전날).
    #
    # 최신분 조회는 `orderBy=createdAt desc` 로 50건만 본다 — 매번 전량(현재 194건)을 읽으면
    # 5분 주기 기준 하루 5만 건을 넘겨 Firestore 무료 읽기 한도를 태운다. 대신 정렬 조회는
    # createdAt 이 없는 구 폼 문서를 아예 못 보므로, 하루 한 번 정렬 없이 전량을 훑어 줍는다.
    - cron: "20 19 * * *"
  workflow_dispatch:
    inputs:
      full:
        description: "전량 훑기(구 폼 컬렉션 포함) — 평소에는 최신분만 본다"
        type: boolean
        default: false

concurrency:
  group: recruit-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Pull job applications from Firestore
        env:
          SYNC_URL: https://stay-ops-two.vercel.app/api/recruit/sync
          # 19:20 UTC 스케줄과 수동 full 실행만 전량으로 돈다.
          FULL: ${{ inputs.full == true || github.event.schedule == '20 19 * * *' }}
          # 전량 훑기만 시크릿을 요구한다(2026-10-19) — 다른 크론과 같은 저장소 시크릿.
          SYNC_SECRET: ${{ secrets.BEDS24_WEBHOOK_SECRET }}
        run: |
          set -uo pipefail

          url="${SYNC_URL}"
          if [ "${FULL}" = "true" ]; then url="${url}?mode=full"; fi

          auth=()
          if [ "${FULL}" = "true" ]; then auth=(-H "x-recruit-sync-secret: ${SYNC_SECRET}"); fi

          code=$(curl -sS -o /tmp/recruit-sync.json -w '%{http_code}' \
            -X POST "${url}" \
            "${auth[@]}" \
            --max-time 120)
          echo "HTTP ${code} (${url})"
          cat /tmp/recruit-sync.json || true
          echo

          if [ "${code}" != "200" ]; then
            # 502 는 Firestore 를 못 읽었다는 뜻이다 — 규칙이 잠겼거나 프로젝트가 바뀌었다.
            # 여기서 빨간불을 내야 「어제부터 지원서가 안 들어온다」를 사람이 알게 된다.
            echo "::error::recruit sync failed with HTTP ${code}"
            exit 1
          fi

          created=$(jq -r '.created // 0' /tmp/recruit-sync.json)
          updated=$(jq -r '.updated // 0' /tmp/recruit-sync.json)
          skipped=$(jq -r '.skipped // ""' /tmp/recruit-sync.json)
          if [ -n "${skipped}" ]; then
            echo "skipped: ${skipped}"
          else
            echo "created=${created} updated=${updated}"
          fi

          if [ "$(jq -r '.ok' /tmp/recruit-sync.json)" != "true" ]; then
            echo "::error::sync reported failures: $(jq -c '.failed' /tmp/recruit-sync.json)"
            exit 1
          fi
