<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Foldy</title>
<!--
  Capacitor 앱의 연결 실패 화면 (계획 D2, docs/engineering/03-deployment-strategy.md 「연결 실패 화면」).
  앱은 capacitor.config.ts 의 server.url(배포된 웹)을 띄운다. 그 주소를 불러오지 못하면 `server.errorPath` 로 이 파일이 열린다.
  - 정적 파일이라 사전(src/lib/i18n.ts)을 못 쓴다 → 아래 COPY 에 ko/ja/en 을 함께 두고 기기 언어로 하나만 보여 준다.
  - APP_URL 은 capacitor.config.ts 의 기본 server.url 과 같아야 한다. 자체 도메인으로 바꿀 때(계획 C1) 함께 고친다.
  - 다시 시도 = 앱 첫 화면으로 다시 이동. 연결이 돌아오면(online 이벤트) 자동으로 한 번 시도한다.
-->
<style>
  :root { color-scheme: light; --bg: #ffffff; --ink: #16141f; --muted: #6b6878; --primary: #7a52e6; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; min-height: 100dvh; display: flex; align-items: center; justify-content: center;
         background: var(--bg); color: var(--ink); text-align: center;
         font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Apple SD Gothic Neo", "Noto Sans JP", "Noto Sans KR", system-ui, sans-serif;
         padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom); -webkit-user-select: none; user-select: none; }
  main { width: 100%; max-width: 340px; }
  .mark { width: 64px; height: 64px; margin: 0 auto 20px; display: block; border-radius: 15px; }
  h1 { font-size: 20px; line-height: 1.35; margin: 0 0 10px; font-weight: 700; }
  p { font-size: 14px; line-height: 1.6; margin: 0; color: var(--muted); }
  button { margin-top: 24px; width: 100%; height: 48px; border: 0; border-radius: 14px;
           background: var(--primary); color: #fff; font: inherit; font-size: 15px; font-weight: 700; }
  button:active { opacity: .85; }
  button[disabled] { opacity: .6; }
  #status { min-height: 20px; margin-top: 12px; font-size: 13px; }
</style>
</head>
<body>
<main>
  <img class="mark" src="icon.png" alt="" width="64" height="64" />
  <h1 id="title"></h1>
  <p id="body"></p>
  <button id="retry" type="button"></button>
  <p id="status" role="status" aria-live="polite"></p>
</main>
<script>
  var APP_URL = "https://stay-ops-two.vercel.app/";
  var COPY = {
    ko: { offlineTitle: "인터넷에 연결되어 있지 않아요", offlineBody: "연결을 확인한 뒤 다시 시도해 주세요. 연결이 돌아오면 자동으로 다시 불러옵니다.",
          serverTitle: "Foldy 에 연결할 수 없어요", serverBody: "잠시 후 다시 시도해 주세요. 계속되면 관리자에게 알려 주세요.",
          retry: "다시 시도", checking: "연결하는 중…", still: "아직 연결되지 않았어요." },
    ja: { offlineTitle: "インターネットに接続されていません", offlineBody: "接続を確認してから、もう一度お試しください。接続が戻ると自動で再読み込みします。",
          serverTitle: "Foldy に接続できません", serverBody: "しばらくしてから、もう一度お試しください。続く場合は管理者にお知らせください。",
          retry: "再試行", checking: "接続しています…", still: "まだ接続されていません。" },
    en: { offlineTitle: "You're offline", offlineBody: "Check your connection and try again. We'll reload automatically once you're back online.",
          serverTitle: "Can't reach Foldy", serverBody: "Please try again in a moment. If this keeps happening, let your admin know.",
          retry: "Try again", checking: "Connecting…", still: "Still offline." }
  };
  function pickLocale() {
    var langs = (navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || "en"]);
    for (var i = 0; i < langs.length; i++) {
      var code = String(langs[i] || "").slice(0, 2).toLowerCase();
      if (COPY[code]) return code;
    }
    return "en";
  }
  var locale = pickLocale();
  var t = COPY[locale];
  document.documentElement.lang = locale;
  var el = function (id) { return document.getElementById(id); };
  var retryBtn = el("retry");
  var status = el("status");

  function render() {
    var offline = navigator.onLine === false;
    el("title").textContent = offline ? t.offlineTitle : t.serverTitle;
    el("body").textContent = offline ? t.offlineBody : t.serverBody;
    retryBtn.textContent = t.retry;
  }

  function retry() {
    if (navigator.onLine === false) { status.textContent = t.still; render(); return; }
    retryBtn.disabled = true;
    status.textContent = t.checking;
    // 실패하면 네이티브가 다시 이 화면을 연다(errorPath) — 따로 시간 제한을 두지 않는다.
    location.replace(APP_URL);
  }

  retryBtn.addEventListener("click", retry);
  window.addEventListener("online", function () { render(); retry(); });
  window.addEventListener("offline", function () { status.textContent = ""; retryBtn.disabled = false; render(); });
  render();
</script>
</body>
</html>
