name: Beds24 external review sync

# WHY THIS IS A GITHUB ACTION AND NOT A VERCEL CRON
# -------------------------------------------------
# Two independent reasons, both already paid for once by this project:
#
# 1. Plan limits. This project runs on Vercel's free Hobby plan, which allows at
#    most 2 cron jobs and only once-per-day schedules. vercel.json already spends
#    both slots (reconcile + task reminders). Collection runs once a day (below);
#    staff can also collect on demand from the 외부 리뷰 screen («지금 가져오기»).
#
# 2. Vercel cron proved unreliable here. On 2026-07-22 both Vercel crons had not
#    fired for days — a platform/plan-side scheduling failure, not a code problem —
#    and 5 days of reservations went silently missing. See
#    .github/workflows/beds24-reconcile.yml and docs/planning/01-decision-log.md.
#    Any new scheduled job therefore gets an external trigger from the start.
#
# The endpoint is idempotent (UPSERT on organization_id + provider +
# external_review_id), so a duplicate or retried run is harmless.
#
# SETUP (one-time): the repository secret CRON_SECRET must already exist
#   for the reconcile workflow; this job reuses it. The reviews-sync endpoint
#   accepts it only as `Authorization: Bearer`, exactly like reconcile.

on:
  schedule:
    # Once a day at 08:05 Asia/Tokyo (= 23:05 UTC the previous day).
    #
    # Daily is enough: reviews are written days after checkout, so nothing is time-critical,
    # and the Airbnb 50-per-room cap is never reached in a single day. Halving the old
    # twice-daily cadence also halves the credit spend.
    #
    # :05 rather than :00 keeps it clear of the Vercel task-reminder cron at 23:00 UTC, and
    # the reconcile workflow runs at :13 past every 6th hour — so all three stay apart and
    # never contend for Beds24's credit window.
    - cron: "5 23 * * *"
  workflow_dispatch:
    inputs:
      full:
        description: "Deep sweep (Booking.com back 180 days) instead of the rolling 30-day window"
        type: boolean
        default: false

concurrency:
  group: beds24-reviews-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger external review collection
        env:
          SYNC_URL: https://stay-ops-two.vercel.app/api/beds24/reviews-sync
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          FULL: ${{ inputs.full }}
        run: |
          set -uo pipefail
          if [ -z "${CRON_SECRET}" ]; then
            echo "::error::CRON_SECRET repository secret is not set — add it in repo Settings → Secrets → Actions (same value as Vercel production CRON_SECRET)."
            exit 1
          fi

          # WHY THIS LOOPS (2026-08-07)
          # ---------------------------
          # One cycle calls Beds24 once per target (~71 targets, measured 126s). Vercel Hobby caps a
          # function at 60s, so the single-shot version returned 504 FUNCTION_INVOCATION_TIMEOUT on
          # every scheduled run and not one review was ever collected by the cron. The endpoint now
          # processes a slice per call and reports where to resume; we keep calling until it says
          # done. Total Beds24 calls are unchanged, so credit spend is identical.
          org=""
          offset=0
          upserted_total=0
          requests_total=0
          # Safety stop: 71 targets / 12 per call ≈ 6 calls. 40 leaves generous headroom while still
          # refusing to spin forever if the endpoint ever stops advancing the cursor.
          for step in $(seq 1 40); do
            url="${SYNC_URL}?offset=${offset}"
            if [ -n "${org}" ]; then url="${url}&organizationId=${org}"; fi
            if [ "${FULL}" = "true" ]; then url="${url}&full=1"; fi

            code=$(curl -sS -o /tmp/reviews-sync.json -w '%{http_code}' \
              -X POST "${url}" \
              -H "Authorization: Bearer ${CRON_SECRET}" \
              --max-time 120)
            echo "step ${step}: HTTP ${code} (offset=${offset} org=${org:-first})"
            cat /tmp/reviews-sync.json || true
            echo

            # 202 = paused by BEDS24_SYNC_PAUSED — nothing to do, and not an error.
            if [ "${code}" = "202" ]; then echo "sync paused"; exit 0; fi
            if [ "${code}" != "200" ] && [ "${code}" != "207" ]; then
              echo "::error::reviews sync failed with HTTP ${code} at offset ${offset}"
              exit 1
            fi

            upserted_total=$(( upserted_total + $(jq -r '.upserted // 0' /tmp/reviews-sync.json) ))
            requests_total=$(( requests_total + $(jq -r '.requests // 0' /tmp/reviews-sync.json) ))

            # A 207 means this organization blew up; the body still points at the next one, so the
            # loop keeps going and the run ends red at the bottom.
            if [ "${code}" = "207" ]; then failed=1; fi

            if [ "$(jq -r '.done' /tmp/reviews-sync.json)" = "true" ]; then
              echo "reviews sync complete — upserted=${upserted_total} beds24Requests=${requests_total}"
              if [ "${failed:-0}" = "1" ]; then
                echo "::error::one or more organizations failed"
                exit 1
              fi
              exit 0
            fi

            org=$(jq -r '.nextOrganizationId // empty' /tmp/reviews-sync.json)
            offset=$(jq -r '.nextOffset // 0' /tmp/reviews-sync.json)
          done

          echo "::error::reviews sync did not finish within the step budget — cursor may not be advancing"
          exit 1
