name: Secret scan

# WHY THIS EXISTS (2026-10-20)
# ---------------------------------------------------------------------------
# 저장소가 공개(public)라, Beds24 토큰 · Supabase 키 · VAPID 키 같은 비밀값이 실수로 커밋되면 바로 노출된다.
# 푸시 · PR 마다 새로 들어온 커밋을 gitleaks 로 검사한다. 걸리면 ✗ — 그때는 커밋을 되돌리는 것만으론 부족하고
# **그 비밀값을 바로 교체(rotate)** 해야 한다(이력에 남아 있으므로).
#
# - 오탐은 `.gitleaksignore` 에 지문(fingerprint)으로 넣는다. 진짜 비밀값이 아님을 확인한 것만.
# - 2026-10-20 전체 이력(1,031 커밋) 검사: 진짜 유출 0건, 오탐 3건(예외 등록).

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
